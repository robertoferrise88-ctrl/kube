<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Würfel-Spiel</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #f4f5ff;
      background: #10121c;
      font-family: system-ui, Arial, sans-serif;
    }

    button, select { font: inherit; }

    #menu {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(ellipse at top, #29345e 0%, #10121c 68%);
    }

    .card {
      width: min(440px, 100%);
      padding: 30px;
      text-align: center;
      background: #191c29;
      border: 1px solid #424861;
      border-radius: 18px;
      box-shadow: 0 20px 80px #0008;
    }

    .card p {
      color: #b8bfd8;
      line-height: 1.5;
    }

    .card label {
      display: block;
      margin: 22px 0 8px;
      text-align: left;
    }

    button, select {
      width: 100%;
      padding: 11px;
      color: #f4f5ff;
      background: #292e42;
      border: 1px solid #424861;
      border-radius: 9px;
      cursor: pointer;
    }

    button:hover { background: #3a415c; }

    #start {
      margin-top: 14px;
      background: #596de8;
      border-color: #7485f4;
      font-weight: 700;
    }

    #game {
      display: none;
      min-height: 100vh;
      grid-template-columns: minmax(0, 1fr) 260px;
    }

    #view {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #20263b, #10121c 72%);
    }

    #view canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #view canvas:active { cursor: grabbing; }

    #panel {
      padding: 22px;
      background: #191c29;
      border-left: 1px solid #303449;
    }

    #panel p { color: #b8bfd8; }

    #status {
      min-height: 48px;
      line-height: 1.4;
    }

    .move-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .wide { margin-top: 12px; }

    .hint {
      margin-top: 18px;
      font-size: 13px;
      color: #9da6c4;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      #game { grid-template-columns: 1fr; }
      #view { min-height: 60vh; }
      #panel {
        border-left: 0;
        border-top: 1px solid #303449;
      }
    }
  </style>
</head>

<body>
  <main id="menu">
    <section class="card">
      <h1>🧩 Würfel-Spiel</h1>
      <p>Wähle deinen Würfel und versuche, alle Seiten wieder richtig zu sortieren.</p>

      <label for="cubeSize">Welchen Würfel möchtest du spielen?</label>
      <select id="cubeSize">
        <option value="2">2 × 2 – leicht</option>
        <option value="3" selected>3 × 3 – klassisch</option>
        <option value="4">4 × 4 – knifflig</option>
      </select>

      <button id="start">Spiel starten</button>
    </section>
  </main>

  <main id="game">
    <div id="view"></div>

    <aside id="panel">
      <h2>Dein Würfel</h2>
      <p id="status">Ziehe mit der Maus direkt am Würfel, um ihn zu drehen.</p>
      <p>Züge: <strong id="moves">0</strong></p>

      <h3>Seite drehen</h3>
      <div class="move-grid">
        <button data-move="U">U</button>
        <button data-move="U'">U′</button>
        <button data-move="D">D</button>
        <button data-move="D'">D′</button>
        <button data-move="L">L</button>
        <button data-move="L'">L′</button>
        <button data-move="R">R</button>
        <button data-move="R'">R′</button>
        <button data-move="F">F</button>
        <button data-move="F'">F′</button>
        <button data-move="B">B</button>
        <button data-move="B'">B′</button>
      </div>

      <button class="wide" id="shuffle">Würfel mischen</button>
      <p class="hint">Klicke auf den Würfel, halte die Maustaste gedrückt und ziehe.</p>
    </aside>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const menu = document.querySelector("#menu");
    const game = document.querySelector("#game");
    const view = document.querySelector("#view");
    const statusText = document.querySelector("#status");
    const movesText = document.querySelector("#moves");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#10121c");

    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    // Von unten auf die weiße Unterseite schauen.
    camera.position.set(5, -5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    view.appendChild(renderer.domElement);

    // Der Würfel ist in dieser Gruppe. Die Maus dreht die Gruppe,
    // nicht die Kamera.
    const cubeRoot = new THREE.Group();
    scene.add(cubeRoot);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x46465a, 2));

    const light = new THREE.DirectionalLight(0xffffff, 2.5);
    light.position.set(5, 8, 6);
    scene.add(light);

    const spacing = 1.03;
    const quarterTurn = Math.PI / 2;

    let cubies = [];
    let cubeSize = 3;
    let moveCount = 0;
    let queue = [];
    let busy = false;

    const faces = {
      R: { axis: "x", side:  1, direction: -1 },
      L: { axis: "x", side: -1, direction:  1 },
      U: { axis: "y", side:  1, direction: -1 },
      D: { axis: "y", side: -1, direction:  1 },
      F: { axis: "z", side:  1, direction: -1 },
      B: { axis: "z", side: -1, direction:  1 }
    };

    // Mausbewegung dreht den Würfel selbst.
    let dragging = false;
    let previousX = 0;
    let previousY = 0;

    renderer.domElement.addEventListener("pointerdown", event => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", event => {
      if (!dragging) return;

      const deltaX = event.clientX - previousX;
      const deltaY = event.clientY - previousY;
      previousX = event.clientX;
      previousY = event.clientY;

      cubeRoot.rotation.y += deltaX * 0.01;
      cubeRoot.rotation.x += deltaY * 0.01;
    });

    renderer.domElement.addEventListener("pointerup", () => {
      dragging = false;
    });

    renderer.domElement.addEventListener("pointercancel", () => {
      dragging = false;
    });

    function resize() {
      const width = view.clientWidth;
      const height = view.clientHeight;
      if (!width || !height) return;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function makeCube(size) {
      cubeSize = size;
      moveCount = 0;
      movesText.textContent = "0";
      cubies = [];
      queue = [];

      // Vorhandene Würfelteile entfernen.
      while (cubeRoot.children.length > 0) {
        cubeRoot.remove(cubeRoot.children[0]);
      }

      const bodyGeometry =
        new RoundedBoxGeometry(0.98, 0.98, 0.98, 3, 0.07);

      const stickerGeometry =
        new RoundedBoxGeometry(0.82, 0.82, 0.04, 3, 0.06);

      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: "#101116",
        roughness: 0.32
      });

      const colors = {
        right: "#ef4444",
        left: "#ff8a24",
        top: "#f0ce24",
        bottom: "#f8f8f5",
        front: "#24bd68",
        back: "#3280ed"
      };

      const materials = {};
      for (const [name, color] of Object.entries(colors)) {
        materials[name] = new THREE.MeshStandardMaterial({
          color,
          roughness: 0.26,
          metalness: 0.03
        });
      }

      function addSticker(cubie, colorName, x, y, z, rx, ry, rz) {
        const sticker = new THREE.Mesh(
          stickerGeometry,
          materials[colorName]
        );
        sticker.position.set(x, y, z);
        sticker.rotation.set(rx, ry, rz);
        cubie.add(sticker);
      }

      for (let x = 0; x < size; x++) {
        for (let y = 0; y < size; y++) {
          for (let z = 0; z < size; z++) {
            const cubie = new THREE.Group();
            cubie.add(new THREE.Mesh(bodyGeometry, bodyMaterial));

            if (x === size - 1)
              addSticker(cubie, "right", 0.50, 0, 0, 0, Math.PI / 2, 0);

            if (x === 0)
              addSticker(cubie, "left", -0.50, 0, 0, 0, -Math.PI / 2, 0);

            if (y === size - 1)
              addSticker(cubie, "top", 0, 0.50, 0, -Math.PI / 2, 0, 0);

            if (y === 0)
              addSticker(cubie, "bottom", 0, -0.50, 0, Math.PI / 2, 0, 0);

            if (z === size - 1)
              addSticker(cubie, "front", 0, 0, 0.50, 0, 0, 0);

            if (z === 0)
              addSticker(cubie, "back", 0, 0, -0.50, 0, Math.PI, 0);

            cubie.position.set(
              (x - (size - 1) / 2) * spacing,
              (y - (size - 1) / 2) * spacing,
              (z - (size - 1) / 2) * spacing
            );

            cubeRoot.add(cubie);
            cubie.userData.homePosition = cubie.position.clone();
            cubie.userData.homeRotation = cubie.quaternion.clone();
            cubies.push(cubie);
          }
        }
      }

      cubeRoot.rotation.set(0, 0, 0);
    }

    function addMove(notation) {
      queue.push(notation);
      runNextMove();
    }

    function runNextMove() {
      if (busy || queue.length === 0) return;

      busy = true;

      const notation = queue.shift();
      const face = faces[notation[0]];
      const inverse = notation.endsWith("'");

      const outerPosition =
        face.side * ((cubeSize - 1) / 2) * spacing;

      const layer = cubies.filter(cubie =>
        Math.abs(cubie.position[face.axis] - outerPosition) < 0.1
      );

      const pivot = new THREE.Group();
      cubeRoot.add(pivot);
      layer.forEach(cubie => pivot.attach(cubie));

      const direction = face.direction * (inverse ? -1 : 1);
      const startTime = performance.now();
      const duration = 180;

      function animateTurn(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);

        pivot.rotation.set(0, 0, 0);
        pivot.rotation[face.axis] = direction * quarterTurn * eased;

        if (progress < 1) {
          requestAnimationFrame(animateTurn);
          return;
        }

        pivot.rotation[face.axis] = direction * quarterTurn;
        pivot.updateMatrixWorld(true);

        layer.forEach(cubie => {
          cubeRoot.attach(cubie);

          cubie.position.set(
            Math.round(cubie.position.x / spacing) * spacing,
            Math.round(cubie.position.y / spacing) * spacing,
            Math.round(cubie.position.z / spacing) * spacing
          );

          const euler = new THREE.Euler()
            .setFromQuaternion(cubie.quaternion, "XYZ");

          euler.set(
            Math.round(euler.x / quarterTurn) * quarterTurn,
            Math.round(euler.y / quarterTurn) * quarterTurn,
            Math.round(euler.z / quarterTurn) * quarterTurn
          );

          cubie.quaternion.setFromEuler(euler);
        });

        cubeRoot.remove(pivot);
        moveCount++;
        movesText.textContent = String(moveCount);
        busy = false;

        checkSolved();
        runNextMove();
      }

      requestAnimationFrame(animateTurn);
    }

    function checkSolved() {
      const solved = cubies.every(cubie =>
        cubie.position.distanceTo(cubie.userData.homePosition) < 0.08 &&
        Math.abs(cubie.quaternion.dot(cubie.userData.homeRotation)) > 0.999
      );

      statusText.textContent = solved
        ? "Geschafft! Dein Würfel ist gelöst 🎉"
        : "Ziehe den Würfel mit der Maus oder nutze die Zug-Knöpfe.";
    }

    document.querySelector("#start").addEventListener("click", () => {
      menu.style.display = "none";
      game.style.display = "grid";

      makeCube(Number(document.querySelector("#cubeSize").value));
      resize();

      statusText.textContent =
        "Ziehe den Würfel mit der Maus, um ihn zu drehen.";
    });

    document.querySelectorAll("[data-move]").forEach(button => {
      button.addEventListener("click", () => {
        addMove(button.dataset.move);
      });
    });

    document.querySelector("#shuffle").addEventListener("click", () => {
      queue = [];

      const choices = Object.keys(faces);
      let previousFace = "";

      for (let i = 0; i < 20; i++) {
        let face;

        do {
          face = choices[Math.floor(Math.random() * choices.length)];
        } while (face === previousFace);

        previousFace = face;
        queue.push(face + (Math.random() < 0.5 ? "'" : ""));
      }

      statusText.textContent = "Gemischt! Jetzt bist du dran.";
      runNextMove();
    });

    window.addEventListener("resize", resize);

    function render() {
      requestAnimationFrame(render);
      renderer.render(scene, camera);
    }

    render();
  </script>
</body>
</html>
